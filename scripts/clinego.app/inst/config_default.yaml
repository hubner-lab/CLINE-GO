#=============================================================================
# CLINE-GO Default Configuration
# Copy this file to config_{project_name}.yaml and fill in your values.
# CPU cores and ploidy are managed automatically (auto-detected / diploid).
#=============================================================================

#-----------------------------------------------------------------------------
# INPUT: Files and project settings
#-----------------------------------------------------------------------------
Input:
  dir: ""                          # Directory containing input files (relative to /pipeline/)
  vcf: ""                          # VCF file (.vcf or .vcf.gz)
  metadata: ""                     # Sample metadata TSV (columns: site, sample, latitude, longitude)
  gff: ""                          # GFF3 file for gene annotation (optional, leave empty to skip)

project_name: ""                   # Output directory prefix: {project_name}_results/

#-----------------------------------------------------------------------------
# REGIME: which modules this project has at all (declared at creation)
#-----------------------------------------------------------------------------
Regime:
  mode: standard                   # standard: geography + climate (structure, GEA, maladaptation)
                                   # gwas_only: no coordinates (structure + GWAS only)
                                   # Climate.enabled below is DERIVED from this on every save.

#-----------------------------------------------------------------------------
# FILTER: VCF quality filtering
#-----------------------------------------------------------------------------
Filter:
  maf: 0.05                        # Minor allele frequency threshold
  snp_miss: 0.1                    # Max SNP missingness (remove SNPs missing in >10% samples)
  sample_miss: 0.5                 # Max sample missingness (remove samples with >50% missing)
  min_depth: null                  # Optional: mask genotypes with FORMAT/DP < N (null = skip)
  max_depth: null                  # Optional: mask genotypes with FORMAT/DP > N (null = skip)
  het_outlier_sd: null             # Optional: remove samples with heterozygosity beyond N SDs (null = skip)
  relatedness: 0.99                # IBS allele-sharing threshold for coloring/counting related pairs (duplicates cluster ~1.0); liberal default, colors/counts only
  relatedness_action: keep         # keep (default): visualize/count only, remove nothing. remove: drop the higher-missingness member of each pair above the threshold

#-----------------------------------------------------------------------------
# LD: Linkage disequilibrium pruning
#-----------------------------------------------------------------------------
LD:
  window: 100                      # Window size in kb for LD calculation
  step: 20                         # Step size for sliding window
  r2: 0.2                          # R^2 threshold (keep SNPs with r^2 < this value)

#-----------------------------------------------------------------------------
# SNMF: Population structure inference
#-----------------------------------------------------------------------------
sNMF:
  k_start: 2                       # Minimum K (number of ancestral populations) to test
  k_end: 6                         # Maximum K to test
  k_best: null                     # Set after reviewing cross-entropy plots
  repeats: 10                      # Repetitions per K (higher = more stable)
  imputed_maf: null                # MAF filter on the imputed matrices; null = Filter.maf, 0 = off

#-----------------------------------------------------------------------------
# MAP: Geographic extent and resolution for climate data
#-----------------------------------------------------------------------------
Map:
  climate_extent: "auto"           # [min_lon, max_lon, min_lat, max_lat] or "auto"
  gap: 0.5                         # Buffer around samples in degrees (only if auto)
  resolution: 0.5                  # Climate data resolution in arc-minutes (0.5, 2.5, 5, 10)
  zoom_extent: "NULL"              # Optional zoom: "xmin,xmax,ymin,ymax" or "NULL"

#-----------------------------------------------------------------------------
# CLIMATE: Bioclimatic variables + predictor characterization (mode=climate)
#-----------------------------------------------------------------------------
Climate:
  enabled: true                    # Set false to skip all climate-dependent analyses
  predictors: "bio_1,bio_2,bio_3,bio_4,bio_8,bio_9,bio_10,bio_12,bio_14,bio_15"
  Varpart:
    response: pcs                  # 'pcs' (genomic PCs, scalability adaptation) | 'snps' (raw, Lasky-literal)
    response_var_cutoff: 0.8       # keep leading PCs explaining >= 80% of genetic variance
    response_max_pcs: 20
    response_min_pcs: 2            # floor so varpart always has a multivariate Y
    structure_table: qmatrix       # 'qmatrix' (sNMF Q at k_best, last column dropped) | 'none'
    permutations: 999               # varpart anova.cca permutations per testable fraction
  # dbMEM: always site-level (one point per site, centroid of its samples),
  # no min-sites knob — below 3 sites, dbMEM writes a skip record (warning
  # badge in Shiny) instead of a config-time guard.

#-----------------------------------------------------------------------------
# TRAITS: phenotypic factor characterization (mode=traits)
# Runs in both regimes — traits need no coordinates and no climate.
#-----------------------------------------------------------------------------
Traits:
  pairs_max_factors: 8             # Above this many traits the pairs grid is replaced by a placeholder

#-----------------------------------------------------------------------------
# POPULATION STATS
#-----------------------------------------------------------------------------
Population:
  calc_stats: false                # Calculate Tajima's D, Pi, AMOVA (requires >=3 samples/pop)
  window_size: 3000000             # Window size in bp for Tajima's D and Pi diversity
  custom_trait_file: "NULL"        # Custom trait file for piemap sizing (site + trait columns)

#-----------------------------------------------------------------------------
# PIEMAP: Population structure visualization
#-----------------------------------------------------------------------------
Piemap:
  alpha: 0.6                       # Pie chart transparency (0-1)
  show_labels: false               # Show population labels
  label_size: 8                    # Label font size
  pie_scale: 1.0                   # Pie chart size scale factor
  use_points: false                # Use colored points instead of pie charts

#-----------------------------------------------------------------------------
# LDdecay: Linkage disequilibrium decay analysis
#-----------------------------------------------------------------------------
LDdecay:
  group_by: "site"                 # "site" or "cluster" (sNMF K_BEST clusters)
  min_samples: 10                  # Groups below this are skipped
  max_distance: 500                # Max pairwise distance in kb
  scope: "both"                    # "genome_wide", "per_chromosome", or "both"
  max_pairs: 20000000              # PLINK --r2 pairs per group; above it, seeded anchor SNPs
  background_markers_per_chr: 50   # unlinked markers per chromosome for the critical r2
  r2_threshold: 0.2                # level of the r2_threshold decay rule
  seed: 1                          # anchor and unlinked-marker sampling
  # exclude_chromosomes: "X,Y,MT,Pt" # optional: contigs left out of the LD curve and its background
  #                                # (organellar, sex); case, a "chr" prefix and M/MT are ignored

#-----------------------------------------------------------------------------
# GEA: Association analysis settings
#-----------------------------------------------------------------------------
GEA:
  configs:
    - method: "EMMAX"
      adjust: "bonf"
      threshold: '0.05'
    - method: "LFMM"
      adjust: "bonf"
      threshold: '0.05'
  snp_clumping_distance: auto_genome_wide  # ONE distance for the agreement between methods (Cross-method)
                                    # and for merging significant SNPs into regions: the genome-wide LD-decay
                                    # distance (mode=structure's LD-decay table) under clumping_ld_rule;
                                    # "auto_per_chromosome" for one per chromosome, or a fixed bp. The GEA
                                    # tab's filter bar starts at it (until 2026-10-26 the default was 100000)
  clumping_ld_rule: "critical"     # rule an auto_* distance is read under: "critical" (LD meets the
                                    # critical r2 of unlinked markers), "half_decay" (r2 falls to half its
                                    # short-range value) or "r2_threshold" (LDdecay.r2_threshold)
  # region_clumping_distance: 200000 # ADVANCED: a separate distance for the region merge only (bp or
  #                                # auto_*); unset = snp_clumping_distance for both
  promoter_length: 10000           # Promoter region length for SNP annotation
  # snp_sets:                      # SNP sets for mode=maladaptation, declared instead of saved from the
  #                                # GEA tab; built by mode=gea as _intermediate/snp_sets/gea.<name>/.
  #                                # Saving a set in the app shows the block that reproduces it.
  #                                # Full grammar: docs/configuration.md, "Declared SNP sets".
  #   - name: default              # each method's own GEA.configs rule, every column, Union
  #   - name: strict
  #     threshold_type: bonf       # bonf | qval | top | custom, applied to every cell
  #     threshold_value: 0.01
  #     strategy: Cross-method     # Union (default) | Cross-method | Cross-method per-trait
  #   - name: tuned
  #     traits: [bio_1, bio_12]    # omitted = every predictor; methods: [...] likewise
  #     overrides:                 # method, trait or "trait::method"; most specific wins
  #       LFMM: {value: 0.01}
  #       "bio_12::EMMAX": {type: custom, value: 1.0e-5}

#-----------------------------------------------------------------------------
# PREGEA: GEA hyperparameter exploration (mode=pregea, LD-pruned dataset only)
# Focused module: "how many K / how many PCs". Predictor characterization
# lives under Climate above. Fixed constants (not configurable — see
# README "Fixed constants"): seed=42, LFMM/EMMAX/RDA always run together,
# kinship=BN always (GAPIT uses the same matrix), genomic_control=FALSE
# always in PreGEA (GEA.configs[LFMM].params.genomic_control is the only
# place this toggles), FDR=0.1, RDA.min_predictors=2, lambda_tol=0.15,
# deflation_floor=0.90, ordiR2step's Pin/R2permutations.
#-----------------------------------------------------------------------------
PreGEA:
  predictors: "bio_1,bio_2,bio_3,bio_4,bio_8,bio_9,bio_10,bio_12,bio_14,bio_15"  # falls back to Climate.predictors when unset
  k_offset: 2                # LFMM K sweep = sNMF.k_best +/- this
  n_pcs_max: 10               # shared ceiling: EMMAX/GAPIT #PCs AND RDA Condition() PCs, both 0..this
  Advanced:
    collinearity_r: 0.7       # |r| pre-screen before the RDA fit
    vif_max: 10.0             # post-fit vif.cca cutoff (real gate, see rda_setup)
    axis_alpha: 0.05          # RDA constrained-axis significance
    permutations: 999         # anova.cca permutations
  TransferGuard:
    enabled: no                 # OFF by default: pulls the FULL-set imputation chain into a pruned-only mode
    lfmm_k: auto                # 'auto' resolves from pregea_recommendations.tsv inside the script
    emmax_n_pcs: auto

#-----------------------------------------------------------------------------
# GWAS: Phenotype association settings
#-----------------------------------------------------------------------------
GWAS:
  configs:
    - method: "EMMAX"
      adjust: "bonf"
      threshold: '0.05'
    - method: "BLINK"
      adjust: "bonf"
      threshold: '0.05'
  missing_strategy: "DROP"         # How to handle samples missing phenotype data
  snp_clumping_distance: auto_genome_wide  # ONE distance for the agreement between methods and the region
                                    # merge: the genome-wide LD-decay distance under clumping_ld_rule (GEA's
                                    # rule unless set here), or a fixed bp. The GWAS tab's filter bar starts at it
  # region_clumping_distance: 200000 # ADVANCED: a separate distance for the region merge only (bp or
  #                                # auto_*); unset = snp_clumping_distance for both
  promoter_length: 10000           # Promoter region length for SNP annotation

#-----------------------------------------------------------------------------
# GFF: Gene annotation parsing
#-----------------------------------------------------------------------------
GFF:
  feature: "mRNA"                  # Feature type to extract
  gene_name: "description"         # Attribute for gene names
  biotype: "biotype"               # Attribute for gene biotype
  go_field: "NULL"                 # GFF attribute with GO terms (NULL to skip enrichment)

#-----------------------------------------------------------------------------
# ENRICHMENT: GO enrichment visualization
#-----------------------------------------------------------------------------
Enrichment:
  top_terms: 20                    # Number of top enriched terms in plots
  plot_width: 12
  plot_height: 10
  cnet_label: "gene_id"            # Gene label in cnetplot: "gene_id", "Name", "description"

#-----------------------------------------------------------------------------
# FUTURE CLIMATE: Projections for maladaptation analysis
#-----------------------------------------------------------------------------
Future:
  ssp: '585'                       # Shared Socioeconomic Pathway (126, 245, 370, 585)
  year: '2061-2080'                # Time period for projections
  models: 'MPI-ESM1-2-HR,UKESM1-0-LL,IPSL-CM6A-LR'

#-----------------------------------------------------------------------------
# MALADAPTATION: Gradient Forest modeling for genetic offset
#-----------------------------------------------------------------------------
Maladaptation:
  methods:
    gradient_forest:
      ntree: '1000'
      cor_threshold: '0.5'
      spatial_correction: 'with'       # Include spatial variables: with/without
      random_model: true               # Also build neutral model for comparison
      extrap: true                     # Beyond the training climate range: true = linear continuation
                                       # (gradientForest default), false = plateau at the range limit.
                                       # gradient_forest_diagnostics.tsv reports the share of cells outside it.
    geometric_offset:
      scale: true                      # Standardise climate predictors before fitting LFMM2
      k: ''                            # Number of LFMM2 latent factors; blank = sNMF k_best
    rda_offset:
      axes: auto            # 'auto' (anova by-axis at axis_alpha) or an integer >= 2
      axis_alpha: 0.05
      permutations: 999
      condition_pcs: 0      # 0 = canonical (no structure conditioning); >0 is a documented deviation
      seed: 42
  snp_sets: 'all'                      # SNP set(s) to run maladaptation on — 'all' or a list of
                                        # names saved from the GEA tab's "Save SNP set" action
                                        # or declared under GEA/GWAS.snp_sets (gea.<name>, gwas.<name>)
  # predictors: auto                   # predictors the offset models are fitted on; auto = Climate.predictors,
                                        # else a non-redundant subset of it (RDA offset aliases > n_sites-1 predictors)

#-----------------------------------------------------------------------------
# OVERLAP: Combined GEA + GWAS analysis (mode=overlapping)
#-----------------------------------------------------------------------------
GEAxGWAS:
  pairwise:
    window_size: 500000
    min_snps: 2
