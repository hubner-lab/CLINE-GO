# Build the documentation site and publish it on GitHub Pages: https://hubner-lab.github.io/CLINE-GO/
# Same build as documentation/build_docs.sh (Sphinx -E -W: a warning fails the run).
# One-time setup: Settings -> Pages -> Source: GitHub Actions.
name: docs

on:
  push:
    branches: [main]
    paths:
      - "documentation/**"
      - "assets/**"
      - "scripts/clinego.app/inst/config_default.yaml" # literalinclude'd by manual/configuration.md
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the site
        run: documentation/build_docs.sh "$RUNNER_TEMP/site" "$RUNNER_TEMP/venv"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
