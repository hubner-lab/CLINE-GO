# Read the Docs build for the CLINE-GO documentation site (Sphinx + MyST).
# Local equivalent: nix shell nixpkgs#python312 -c documentation/build_docs.sh <outdir> <venv dir>
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: documentation/conf.py
  fail_on_warning: true

python:
  install:
    - requirements: documentation/requirements.txt
